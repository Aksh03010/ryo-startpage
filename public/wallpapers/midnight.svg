<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#040913"/>
      <stop offset="38%" stop-color="#071627"/>
      <stop offset="70%" stop-color="#0a2237"/>
      <stop offset="100%" stop-color="#0c2b45"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="72%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#9fdfff" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#5cc3ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#001830" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#2cffb4" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#37a6ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8e5bff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="auroraGrad2" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#66ffe6" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#2ea6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a1f44" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridgeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123b58" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#05101c" stop-opacity="1"/>
