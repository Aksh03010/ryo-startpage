  <g filter="url(#soft2)" opacity="0.9">
    <ellipse cx="380" cy="300" rx="500" ry="230" fill="url(#auroraGrad)"/>
    <ellipse cx="1520" cy="230" rx="520" ry="190" fill="url(#auroraGrad2)"/>
