  <path d="M-60 760 Q 320 520 640 700 Q 860 820 1080 640 Q 1380 470 1660 640 Q 1830 745 1985 680 L1985 1080 L-60 1080 Z" fill="url(#ridgeA)"/>
  <path d="M-60 940 Q 300 800 620 900 Q 940 995 1260 855 Q 1520 745 1760 880 Q 1875 945 1985 900 L1985 1080 L-60 1080 Z" fill="url(#ridgeB)"/>

